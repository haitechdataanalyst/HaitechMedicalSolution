name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend checks ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0 || true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_API_KEY: ""

  # ── Backend checks ───────────────────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haitech
          POSTGRES_PASSWORD: haitech_dev
          POSTGRES_DB: haitech_medical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haitech -d haitech_medical_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: haitech-medical-backend-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: haitech-medical-backend-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations
        run: npm run db:push
        env:
          NODE_ENV: test
          PORT: 5001
          API_VERSION: v1
          ALLOWED_ORIGINS: http://localhost:3000
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_key_that_is_at_least_100_characters_long_for_the_validation_check_to_pass_here' }}
          JWT_ACCESS_EXPIRY_TIME: 15
          JWT_REFRESH_EXPIRY_TIME: 7
          JWT_RESET_PASSWORD_EXPIRY: 30
          JWT_EMAIL_VERIFICATION_EXPIRY: 30
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: haitech
          POSTGRES_PASS: haitech_dev
          POSTGRES_DB: haitech_medical_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENABLE_PAYLOAD_LOGGING: "false"

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          API_VERSION: v1
          ALLOWED_ORIGINS: http://localhost:3000
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_key_that_is_at_least_100_characters_long_for_the_validation_check_to_pass_here' }}
          JWT_ACCESS_EXPIRY_TIME: 15
          JWT_REFRESH_EXPIRY_TIME: 7
          JWT_RESET_PASSWORD_EXPIRY: 30
          JWT_EMAIL_VERIFICATION_EXPIRY: 30
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: haitech
          POSTGRES_PASS: haitech_dev
          POSTGRES_DB: haitech_medical_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          FRONTEND_URL: http://localhost:3000
          ENABLE_PAYLOAD_LOGGING: "false"
