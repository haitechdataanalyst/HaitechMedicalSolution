# ── Rate limiting zones (defined in http block, included from nginx.conf) ────
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── Upstream definitions ─────────────────────────────────────────────────────
upstream haitech_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream haitech_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name haitechmedical.com.au www.haitechmedical.com.au;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haitechmedical.com.au www.haitechmedical.com.au;

    # ── SSL ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/haitechmedical.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haitechmedical.com.au/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS — submit to preload list once you have verified the site works on HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/haitech_access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/haitech_error.log warn;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # ── Client limits ─────────────────────────────────────────────────────────
    client_max_body_size 20M;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout    75s;

    # ── API routes (backend Node.js) ──────────────────────────────────────────
    location /api/ {
        proxy_pass          http://haitech_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Request-ID      $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;

        # API rate limiting (30 req/min, burst 20)
        # limit_req zone=api burst=20 nodelay;
        # limit_req_status 429;
    }

    # ── Auth endpoints — stricter rate limiting ───────────────────────────────
    location ~ ^/api/v[0-9]+/auth/(login|register|forgot-password) {
        proxy_pass          http://haitech_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Stricter auth rate limiting (10 req/min)
        # limit_req zone=auth burst=5 nodelay;
        # limit_req_status 429;
    }

    # ── Swagger UI ────────────────────────────────────────────────────────────
    location /api-docs {
        proxy_pass         http://haitech_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Restrict access to internal/admin only in production
        # allow 10.0.0.0/8;
        # deny  all;
    }

    # ── Health probes ─────────────────────────────────────────────────────────
    location /health/ {
        proxy_pass         http://haitech_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # No rate limiting on health probes
        access_log off;
    }

    # ── Next.js static assets (long-term cache) ───────────────────────────────
    location /_next/static/ {
        proxy_pass        http://haitech_frontend;
        proxy_http_version 1.1;
        proxy_set_header  Host $host;

        # Immutable assets — Next.js appends content hash to filenames
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Public static files ───────────────────────────────────────────────────
    location /images/ {
        proxy_pass        http://haitech_frontend;
        proxy_http_version 1.1;
        proxy_set_header  Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Next.js frontend (all other routes) ──────────────────────────────────
    location / {
        proxy_pass          http://haitech_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
