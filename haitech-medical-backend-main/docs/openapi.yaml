openapi: 3.1.0
info:
  title: Haitech Medical Backend API
  description: >
    Production-ready REST API for the Haitech Medical e-commerce platform.
    Handles user management, order processing, cart/wishlist, reviews,
    coupons, returns, shipments (DTDC), notifications, admin operations,
    dashboard analytics, Zoho inventory, and Razorpay payments. Identity is
    provided by Supabase (see the Auth tag and the BearerAuth security
    scheme) — this backend's own login/register/token endpoints are
    deprecated.
  version: 1.2.0
  contact:
    name: Haitech Medical Engineering
    email: tech@haitech-group.com
  license:
    name: ISC

servers:
  - url: http://localhost:{port}/api/{version}
    description: Local development
    variables:
      port:
        default: "5000"
      version:
        default: v1
  - url: https://haitechmedical.com.au/api/v1
    description: Production

tags:
  - name: Auth
    description: >
      DEPRECATED — this backend's own login/register/token endpoints. Supabase
      is now the sole identity source (see BearerAuth below); every operation
      in this tag is marked deprecated and left mounted only for reference.
  - name: Users
    description: User profile and address management
  - name: Orders
    description: Order placement and lifecycle management
  - name: Payments
    description: Razorpay payment creation and verification
  - name: Admin
    description: >
      Admin-only order/user/inventory/payment/coupon/revenue management.
      Every operation requires the admin role via BearerAuth.
  - name: Cart
    description: Server-side cart for authenticated users
  - name: Wishlist
    description: Saved products for authenticated users
  - name: Reviews
    description: Product reviews and admin moderation
  - name: Coupons
    description: Discount coupon validation and admin management
  - name: Returns
    description: Post-delivery return requests and admin processing
  - name: Notifications
    description: In-app user notifications
  - name: Shipments
    description: DTDC shipment creation, tracking, and pincode serviceability
  - name: Products
    description: Public product catalog browsing, search, and comparison
  - name: Dashboard
    description: Admin analytics — order/user stats, top products, revenue
  - name: Inventory
    description: Read-through cache of Zoho Inventory stock data
  - name: Health
    description: Service health checks and readiness probes

# ── Security Schemes ──────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase-issued access token (Supabase is the sole identity source as
        of the auth migration — see the Auth tag). The backend verifies it via
        supabase.auth.getUser(token) against Supabase's own Auth server, then
        resolves/JIT-provisions a local user row. This is NOT a token obtained
        from any endpoint in this spec — the /auth/* endpoints below are
        deprecated and no longer produce a token this backend accepts.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        DEPRECATED — CSRF token for the deprecated cookie-based /auth/logout
        and /auth/refresh-token flow. Obtain via GET /auth/csrf-token.

  # ── Reusable Schemas ────────────────────────────────────────────────────────
  schemas:

    SuccessResponse:
      type: object
      properties:
        timestamp:   { type: string, format: date-time }
        statusCode:  { type: integer, example: 200 }
        status:      { type: integer, example: 200 }
        success:     { type: boolean, example: true }
        message:     { type: string, example: Success }
        data:        { type: object, nullable: true }

    ErrorResponse:
      type: object
      properties:
        timestamp:   { type: string, format: date-time }
        statusCode:  { type: integer, example: 400 }
        status:      { type: integer, example: 400 }
        success:     { type: boolean, example: false }
        message:     { type: string, example: Validation error }
        error:       { type: object, nullable: true }

    PaginationMeta:
      type: object
      properties:
        page:        { type: integer, example: 1 }
        limit:       { type: integer, example: 10 }
        total:       { type: integer, example: 42 }
        totalPages:  { type: integer, example: 5 }

    User:
      type: object
      properties:
        id:           { type: string, format: uuid }
        firstName:    { type: string, example: Ranvijay }
        lastName:     { type: string, example: Singh }
        username:     { type: string, example: ranvijay }
        email:        { type: string, format: email }
        phone:        { type: string, example: "9876543210", nullable: true }
        roles:        { type: array, items: { type: string }, example: [user] }
        role:         { type: string, example: user, nullable: true }
        emailVerified: { type: boolean, example: false }
        phoneVerified: { type: boolean, example: false }
        authProvider: { type: string, example: local }
        active:       { type: boolean, example: true }
        createdAt:    { type: string, format: date-time }
        modifiedAt:   { type: string, format: date-time }

    AuthSession:
      type: object
      properties:
        user:         { $ref: "#/components/schemas/User" }
        accessToken:  { type: string, description: Short-lived JWT access token }
        refreshToken: { type: string, description: Long-lived JWT refresh token (also set as httpOnly cookie) }

    Address:
      type: object
      properties:
        id:           { type: string, format: uuid }
        userId:       { type: string, format: uuid }
        fullName:     { type: string, example: Dr. Priya Mehta }
        phone:        { type: string, example: "9876543210" }
        addressLine1: { type: string, example: 101 MG Road }
        addressLine2: { type: string, nullable: true }
        landmark:     { type: string, nullable: true }
        city:         { type: string, example: Mumbai }
        state:        { type: string, example: Maharashtra }
        postalCode:   { type: string, example: "400001" }
        country:      { type: string, example: India }
        addressType:  { type: string, enum: [home, work, other] }
        isDefault:    { type: boolean }

    OrderItem:
      type: object
      properties:
        id:           { type: string, format: uuid }
        orderId:      { type: string, format: uuid }
        productId:    { type: string, example: admetec-ergo-2.5 }
        productName:  { type: string, example: "Admetec Ergo 2.5x Loupe" }
        productBrand: { type: string, nullable: true }
        productSku:   { type: string, nullable: true }
        quantity:     { type: integer, minimum: 1 }
        unitPrice:    { type: integer, description: Unit price in paise (1 INR = 100 paise) }
        totalPrice:   { type: integer, description: Total price in paise }

    Order:
      type: object
      properties:
        id:              { type: string, format: uuid }
        userId:          { type: string, format: uuid }
        status:          { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
        paymentStatus:   { type: string, enum: [unpaid, paid, refunded] }
        razorpayOrderId: { type: string, nullable: true }
        subtotal:        { type: integer, description: In paise }
        tax:             { type: integer, description: In paise }
        shippingFee:     { type: integer, description: In paise }
        total:           { type: integer, description: In paise }
        currency:        { type: string, example: INR }
        notes:           { type: string, nullable: true }
        items:           { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        createdAt:       { type: string, format: date-time }

    HealthStatus:
      type: object
      properties:
        status:      { type: string, enum: [healthy, degraded] }
        version:     { type: string, example: v1 }
        nodeVersion: { type: string, example: v22.0.0 }
        uptime:      { type: number }
        memory:      { type: object }
        dependencies:
          type: object
          properties:
            database: { type: object, properties: { status: { type: string } } }
            redis:    { type: object, properties: { status: { type: string }, circuitBreaker: { type: string } } }

    # ── Added for Phase 7 doc-sync (previously-undocumented domains) ─────────

    Product:
      type: object
      properties:
        id:            { type: integer, example: 101 }
        slug:          { type: string, example: admetec-ergo-2.5 }
        name:          { type: string, example: "Admetec Ergo 2.5x Loupe" }
        description:   { type: string, nullable: true }
        categoryId:    { type: integer, nullable: true }
        brandId:       { type: integer, nullable: true }
        sku:           { type: string, nullable: true }
        basePrice:     { type: integer, nullable: true, description: In paise }
        currency:      { type: string, example: INR }
        hasVariants:   { type: boolean }
        variantType:   { type: string, nullable: true }
        defaultImage:  { type: string, nullable: true, description: Cloudinary CDN URL }
        gallery:       { type: array, items: { type: string }, nullable: true }
        videos:        { type: array, items: { type: string }, nullable: true }
        catalogueFile: { type: string, nullable: true }
        colorCode:     { type: string, nullable: true }
        sortOrder:     { type: integer }
        contentBlocks:
          type: array
          nullable: true
          description: >
            Parsed from a JSON text column; arbitrary block shapes (e.g. a
            "specifications" block with a data.rows array of {label, value}
            — the source for /products/compare's specs/specKeys).
          items: { type: object }
        relatedProducts:
          type: array
          nullable: true
          description: Parsed from a JSON text column.
          items: { type: object }
        frameVariants:
          type: array
          nullable: true
          description: >
            Parsed from a JSON text column; raw source for the
            /products/{id}/variants endpoint's variants projection.
          items: { type: object }
        active:      { type: boolean }
        createdAt:   { type: string, format: date-time }
        modifiedAt:  { type: string, format: date-time }

    Review:
      type: object
      properties:
        id:               { type: string, format: uuid }
        userId:           { type: string, format: uuid }
        productId:        { type: string, example: "101" }
        orderId:          { type: string, format: uuid, nullable: true }
        rating:           { type: integer, minimum: 1, maximum: 5 }
        title:            { type: string, nullable: true }
        body:             { type: string, nullable: true }
        verifiedPurchase: { type: boolean }
        approved:         { type: boolean }
        createdAt:        { type: string, format: date-time }
        modifiedAt:       { type: string, format: date-time }
        active:           { type: boolean }

    CartItem:
      type: object
      properties:
        id:            { type: string, format: uuid }
        cartId:        { type: string, format: uuid }
        productId:     { type: string, example: admetec-ergo-2.5 }
        productName:   { type: string }
        productSku:    { type: string, nullable: true }
        quantity:      { type: integer, minimum: 1 }
        unitPrice:     { type: integer, description: In paise }
        customization: { type: string, nullable: true }
        updatedAt:     { type: string, format: date-time }

    Coupon:
      type: object
      description: >
        The customer-facing coupon shape (list/create/update under
        /coupons). See AdminCoupon for the /admin/coupons shape, which
        differs in `value`'s wire type — see the field note below.
      properties:
        id:             { type: string, format: uuid }
        code:           { type: string, example: WELCOME10 }
        type:           { type: string, enum: [percent, flat] }
        value:
          type: string
          example: "10.00"
          description: >
            Decimal column returned as a string by the DB driver on this
            router's endpoints (list/create/update return the raw row —
            unlike /coupons/validate and the admin coupon-stats endpoint,
            which explicitly cast this to a number).
        minOrderAmount: { type: integer, description: In paise }
        maxUses:        { type: integer, nullable: true }
        usedCount:      { type: integer }
        perUserLimit:   { type: integer }
        validFrom:      { type: string, format: date-time }
        validUntil:     { type: string, format: date-time, nullable: true }
        active:         { type: boolean }
        createdAt:      { type: string, format: date-time }
        modifiedAt:     { type: string, format: date-time }

    AdminCoupon:
      type: object
      description: >
        Base shape returned by the /admin/coupons create/update/list
        endpoints. Unlike the customer-facing Coupon schema, `value` here
        is a number (explicitly cast server-side), not a decimal string.
      properties:
        id:              { type: string, format: uuid }
        code:            { type: string, example: WELCOME10 }
        type:            { type: string, enum: [percent, flat] }
        value:           { type: number, description: 0-100 for percent; paise for flat }
        minOrderAmount:  { type: integer, description: In paise }
        maxUses:         { type: integer, nullable: true }
        usedCount:       { type: integer }
        perUserLimit:    { type: integer }
        validFrom:       { type: string, format: date-time, nullable: true }
        validUntil:      { type: string, format: date-time, nullable: true }
        active:          { type: boolean }
        createdAt:       { type: string, format: date-time }
        modifiedAt:      { type: string, format: date-time }

    Shipment:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        orderId:            { type: string, format: uuid }
        awbNo:              { type: string, nullable: true, description: "DTDC AWB/consignment reference number; null until DTDC booking succeeds, or always when DTDC is not configured (shipment stays 'pending')" }
        dtdcRefNo:          { type: string, nullable: true }
        carrier:            { type: string, example: DTDC }
        status:             { type: string, example: booked, description: "pending | booked | cancelled" }
        labelUrl:           { type: string, nullable: true }
        trackingEvents:     { type: string, nullable: true, description: "Raw JSON-stringified DTDC tracking payload as stored; parsed separately into the sibling tracking field on the track/get-by-order endpoints" }
        originPincode:      { type: string, nullable: true }
        destinationPincode: { type: string, nullable: true }
        estimatedDelivery:  { type: string, format: date, nullable: true }
        shippedAt:          { type: string, format: date-time, nullable: true }
        deliveredAt:        { type: string, format: date-time, nullable: true }
        createdAt:          { type: string, format: date-time }
        modifiedAt:         { type: string, format: date-time }
        active:             { type: boolean }

    ReturnRequest:
      type: object
      properties:
        id:           { type: string, format: uuid }
        orderId:      { type: string, format: uuid }
        userId:       { type: string, format: uuid }
        reason:       { type: string, example: "Product arrived defective" }
        description:  { type: string, nullable: true }
        status:       { type: string, enum: [pending, approved, rejected, completed] }
        adminNotes:   { type: string, nullable: true }
        refundAmount: { type: integer, nullable: true, description: In paise }
        processedBy:  { type: string, format: uuid, nullable: true }
        processedAt:  { type: string, format: date-time, nullable: true }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time }

    OrderStats:
      type: object
      properties:
        period:        { type: string, enum: [today, week, month, year] }
        since:         { type: string, format: date-time }
        totalOrders:   { type: integer }
        totalRevenue:  { type: integer, description: In paise }
        avgOrderValue: { type: integer, description: In paise, rounded }
        byStatus:
          type: object
          description: Map of order status to count for the period.
          additionalProperties: { type: integer }
          example: { pending: 3, confirmed: 5, delivered: 12 }

    UserStats:
      type: object
      properties:
        period:     { type: string, enum: [today, week, month, year] }
        totalUsers: { type: integer, description: All active users, not scoped to the period }
        newUsers:   { type: integer, description: Users created since the period start }

    TopProduct:
      type: object
      properties:
        productId:    { type: string }
        productName:  { type: string }
        productBrand: { type: string, nullable: true }
        totalQty:     { type: integer }
        totalRevenue: { type: integer, description: In paise }
        orderCount:   { type: integer, description: Distinct orders containing this product }

    ZohoInventoryItem:
      type: object
      description: Normalised subset of a Zoho Inventory item (see zoho.service.js normaliseItem).
      properties:
        id:               { type: string, description: Zoho item_id }
        name:             { type: string }
        sku:              { type: string, nullable: true }
        description:      { type: string, nullable: true }
        status:           { type: string, enum: [active, inactive] }
        itemType:         { type: string, enum: [inventory, service, non_inventory] }
        unit:             { type: string, nullable: true }
        rate:             { type: number, description: Selling price, in Zoho's currency units (not paise) }
        purchaseRate:     { type: number, nullable: true }
        currency:         { type: string, example: INR }
        stockOnHand:      { type: number }
        committedStock:   { type: number }
        availableForSale: { type: number }
        reorderLevel:     { type: number, nullable: true }
        image:            { type: string, format: uri, nullable: true }
        category:         { type: string, nullable: true }
        brand:            { type: string, nullable: true }
        taxName:          { type: string, nullable: true }
        taxRate:          { type: number, nullable: true }
        hsn:              { type: string, nullable: true }
        lastModified:     { type: string, format: date-time, nullable: true }

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:

  # ── Auth ────────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      deprecated: true
      description: >
        DEPRECATED — issues this backend's own JWT, which auth() no longer
        accepts anywhere (Supabase is the sole identity source). The frontend
        no longer calls this; use Supabase's own sign-in instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      deprecated: true
      description: DEPRECATED — see /auth/login. Use Supabase's own sign-up instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, username, email, phone, password]
              properties:
                firstName: { type: string }
                lastName:  { type: string }
                username:  { type: string, minLength: 3, maxLength: 50 }
                email:     { type: string, format: email }
                phone:     { type: string, example: "9876543210" }
                password:  { type: string, format: password, description: "Min 8 chars, 1 upper, 1 lower, 1 number, 1 special" }
      responses:
        "201": { description: Registration successful, content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/SuccessResponse" }, { type: object, properties: { data: { $ref: "#/components/schemas/AuthSession" } } } ] } } } }
        "409": { description: Email or username already taken }
        "422": { description: Validation error }

  /auth/google/signin:
    post:
      tags: [Auth]
      summary: Google sign-in
      deprecated: true
      description: DEPRECATED — see /auth/login. Also unreachable in the current UI (no Google sign-in button is wired up).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googleSub, email, firstName, lastName]
              properties:
                googleSub:  { type: string }
                email:      { type: string, format: email }
                firstName:  { type: string }
                lastName:   { type: string }
                username:   { type: string }
                phone:      { type: string }
      responses:
        "200": { description: Google sign-in successful }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      deprecated: true
      description: >
        DEPRECATED — revokes this backend's own refresh token, which nothing
        issues anymore. Frontend logout goes through Supabase's signOut() instead.
      security:
        - BearerAuth: []
        - CsrfToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: Logged out successfully }

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      deprecated: true
      description: >
        DEPRECATED — see /auth/login. Supabase's browser client auto-refreshes
        its own session; this endpoint's output is not a Supabase token.
      security:
        - CsrfToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:  { type: string }
                          refreshToken: { type: string }
        "401": { description: Invalid or expired refresh token }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      deprecated: true
      description: >
        DEPRECATED — sends a reset link for this backend's own (dead) login
        flow. Password resets go through Supabase's resetPasswordForEmail now.
        Always returns 200 (no email enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Reset email sent (if registered) }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      deprecated: true
      description: DEPRECATED — see /auth/forgot-password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, format: password }
      responses:
        "200": { description: Password reset successful }
        "400": { description: Invalid or expired token }

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email address
      deprecated: true
      description: >
        DEPRECATED — verifies this backend's own email-verify token, which
        nothing issues anymore. Supabase's own signup flow handles email
        confirmation via /auth/callback on the frontend.
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Email verified }
        "400": { description: Invalid or expired token }

  /auth/resend-verification-email:
    post:
      tags: [Auth]
      summary: Resend verification email
      deprecated: true
      description: DEPRECATED — see /auth/verify-email. Also requires a Supabase BearerAuth token to even reach this route today, despite operating on this backend's own dead verification-token store.
      security:
        - BearerAuth: []
      responses:
        "200": { description: Verification email sent }
        "409": { description: Email already verified }

  /auth/csrf-token:
    get:
      tags: [Auth]
      summary: Get CSRF token
      deprecated: true
      description: DEPRECATED — only meaningful for the deprecated /auth/logout and /auth/refresh-token flow.
      responses:
        "200": { description: CSRF cookie set }

  # ── Users ────────────────────────────────────────────────────────────────────

  /users/me:
    get:
      tags: [Users]
      summary: Get my profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "401": { description: Unauthorized }
    put:
      tags: [Users]
      summary: Update profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName:  { type: string }
                username:  { type: string, minLength: 3 }
                phone:     { type: string, nullable: true }
      responses:
        "200": { description: Profile updated }
        "409": { description: Username taken }

  /users/me/password:
    put:
      tags: [Users]
      summary: Change password
      description: Revokes all active tokens after a successful change, forcing re-login on all devices.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword:     { type: string, format: password }
      responses:
        "200": { description: Password changed }
        "401": { description: Current password incorrect }

  /users/me/addresses:
    get:
      tags: [Users]
      summary: List addresses
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          addresses: { type: array, items: { $ref: "#/components/schemas/Address" } }
    post:
      tags: [Users]
      summary: Add address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, addressLine1, city, state, postalCode]
              properties:
                fullName:     { type: string }
                phone:        { type: string }
                addressLine1: { type: string }
                addressLine2: { type: string, nullable: true }
                landmark:     { type: string, nullable: true }
                city:         { type: string }
                state:        { type: string }
                postalCode:   { type: string }
                country:      { type: string, default: India }
                addressType:  { type: string, enum: [home, work, other], default: home }
                isDefault:    { type: boolean, default: false }
      responses:
        "201": { description: Address created }

  /users/me/addresses/{id}:
    put:
      tags: [Users]
      summary: Update address
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200": { description: Address updated }
        "404": { description: Address not found }
    delete:
      tags: [Users]
      summary: Delete address
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Address removed }

  /users/me/addresses/{id}/default:
    put:
      tags: [Users]
      summary: Set default address
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Default address updated }

  # ── Orders ────────────────────────────────────────────────────────────────────

  /orders:
    post:
      tags: [Orders]
      summary: Place order
      description: Creates an order from cart items. Prices must be in paise.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, productName, quantity, unitPrice, totalPrice]
                    properties:
                      productId:    { type: string }
                      productName:  { type: string }
                      productBrand: { type: string, nullable: true }
                      productSku:   { type: string, nullable: true }
                      quantity:     { type: integer, minimum: 1 }
                      unitPrice:    { type: integer, description: In paise }
                      totalPrice:   { type: integer, description: In paise }
                shippingAddressId: { type: string, format: uuid, nullable: true }
                notes:             { type: string, maxLength: 500, nullable: true }
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: "#/components/schemas/Order" }
    get:
      tags: [Orders]
      summary: List my orders
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: Order list with pagination
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order detail
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Order detail with items }
        "404": { description: Order not found }

  /orders/{id}/cancel:
    put:
      tags: [Orders]
      summary: Cancel order
      description: Only pending or confirmed orders can be cancelled.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Order cancelled }
        "400": { description: Order cannot be cancelled }
        "404": { description: Order not found }

  /orders/{id}/return:
    put:
      tags: [Orders]
      summary: Request a return
      description: >
        The single authoritative return-request entry point (also reachable
        as POST /returns/orders/{id}/return — both call the same service).
        Only allowed when the order is in a state that permits a return
        (see the Returns tag for the full lifecycle).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:      { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000, nullable: true }
      responses:
        "200":
          description: Return requested; order moved to return_requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: "#/components/schemas/Order" }
        "400": { description: Order is not in a returnable state }
        "404": { description: Order not found }
        "409": { description: A pending return request already exists for this order }

  /orders/{id}/invoice:
    get:
      tags: [Orders]
      summary: Get order invoice
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice:
                            type: object
                            properties:
                              invoiceNo: { type: string, example: "INV-A1B2C3D4" }
                              orderId:   { type: string, format: uuid }
                              orderDate: { type: string, format: date-time }
                              status:    { type: string }
                              items:     { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
                              subtotal:  { type: integer, description: In paise }
                              tax:       { type: integer, description: In paise }
                              shippingFee: { type: integer, description: In paise }
                              total:     { type: integer, description: In paise }
                              currency:  { type: string, example: INR }
        "404": { description: Order not found }

  /orders/admin/all:
    get:
      tags: [Orders]
      summary: "[Admin] List all orders"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
      responses:
        "200": { description: All orders paginated }
        "403": { description: Admin access required }

  /orders/admin/{id}/status:
    put:
      tags: [Orders]
      summary: "[Admin] Update order status"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, confirmed, shipped, delivered, cancelled] }
      responses:
        "200": { description: Status updated }
        "403": { description: Admin access required }
        "404": { description: Order not found }

  # ── Payments ──────────────────────────────────────────────────────────────────

  /payments/orders/{orderId}:
    post:
      tags: [Payments]
      summary: Create Razorpay order
      description: >
        Creates a Razorpay order for the given internal order ID.
        Returns the Razorpay order ID and key ID needed to initialise the Razorpay checkout SDK.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Razorpay order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          razorpayOrderId: { type: string }
                          amount:          { type: integer, description: In paise }
                          currency:        { type: string, example: INR }
                          keyId:           { type: string }
        "400": { description: Order already paid or not found }

  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify payment signature
      description: >
        Validates the HMAC-SHA256 signature from Razorpay.
        On success, marks the order as paid and status as confirmed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, razorpayOrderId, razorpayPaymentId, razorpaySignature]
              properties:
                orderId:             { type: string, format: uuid }
                razorpayOrderId:     { type: string }
                razorpayPaymentId:   { type: string }
                razorpaySignature:   { type: string }
      responses:
        "200":
          description: Payment verified, order confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: "#/components/schemas/Order" }
        "400": { description: Invalid payment signature }

  /payments/webhooks/razorpay:
    post:
      tags: [Payments]
      summary: Razorpay webhook
      description: >
        Receives payment.captured / order.paid events from Razorpay. No
        BearerAuth — instead verifies the HMAC-SHA256 signature in the
        X-Razorpay-Signature header against the raw request body, using
        RAZORPAY_WEBHOOK_SECRET. Configure this URL in the Razorpay dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Razorpay event payload — signature-verified, not schema-validated.
      parameters:
        - in: header
          name: X-Razorpay-Signature
          required: true
          schema: { type: string }
      responses:
        "200": { description: Event processed (idempotent — already-applied events are a no-op) }
        "400": { description: Invalid or missing signature }
        "500": { description: RAZORPAY_WEBHOOK_SECRET not configured }

  # ── Admin: Orders ─────────────────────────────────────────────────────────────

  /admin/orders:
    get:
      tags: [Admin]
      summary: "[Admin] List all orders"
      description: Returns orders across all users, with optional status/date/user filters.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, shipped, delivered, cancelled, return_requested, returned]
          description: Optional exact-match status filter.
        - in: query
          name: userId
          schema: { type: string, format: uuid }
          description: Optional filter to a single user's orders.
        - in: query
          name: dateFrom
          schema: { type: string, format: date-time }
        - in: query
          name: dateTo
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: All orders, paginated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }

  /admin/orders/{id}:
    get:
      tags: [Admin]
      summary: "[Admin] Get order detail"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order detail with items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: "#/components/schemas/Order" }
        "403": { description: Admin access required }
        "404": { description: Order not found }

  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: "[Admin] Update order status"
      description: >
        Transitions an order to a new status, enforcing the order lifecycle
        state machine (see order.service.js VALID_TRANSITIONS) and writing an
        order_status_history audit row. Same underlying implementation as
        PUT /orders/admin/{id}/status.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, shipped, delivered, cancelled, return_requested, returned]
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: >
                    Required (min 1 char) when status is 'cancelled' or
                    'returned'; optional/nullable otherwise.
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: "#/components/schemas/Order" }
        "400": { description: Invalid status transition, or reason missing for cancelled/returned }
        "403": { description: Admin access required }
        "404": { description: Order not found }

  # ── Admin: Users ─────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [Admin]
      summary: "[Admin] List all users"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive match against first/last name, email, or username.
      responses:
        "200":
          description: All users, paginated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              type: object
                              properties:
                                id:            { type: string, format: uuid }
                                firstName:     { type: string }
                                lastName:      { type: string }
                                username:      { type: string }
                                email:         { type: string, format: email }
                                phone:         { type: string, nullable: true }
                                active:        { type: boolean }
                                createdAt:     { type: string, format: date-time }
                                modifiedAt:    { type: string, format: date-time }
                                emailVerified: { type: boolean, nullable: true }
                                blacklisted:   { type: boolean, nullable: true }
                                authProvider:  { type: string, nullable: true, example: local }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }

  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: "[Admin] Toggle user active status"
      description: Flips the target user's active flag (activate <-> deactivate). No request body.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User activated or deactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            type: object
                            properties:
                              id:     { type: string, format: uuid }
                              active: { type: boolean }
                              email:  { type: string, format: email }
        "403": { description: Admin access required }
        "404": { description: User not found }

  # ── Admin: Inventory ─────────────────────────────────────────────────────────

  /admin/inventory:
    get:
      tags: [Admin]
      summary: "[Admin] List inventory"
      description: Read/write product stock levels, joined with product name/SKU/price.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive match against product name or SKU.
      responses:
        "200":
          description: Inventory rows, paginated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          inventory:
                            type: array
                            items:
                              type: object
                              properties:
                                productId:         { type: integer }
                                productName:       { type: string }
                                productSku:        { type: string, nullable: true }
                                basePrice:         { type: integer, description: In paise }
                                productActive:     { type: boolean }
                                quantity:          { type: integer }
                                reservedQuantity:  { type: integer }
                                availableQuantity: { type: integer, description: quantity - reservedQuantity }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }

  /admin/inventory/{productId}:
    patch:
      tags: [Admin]
      summary: "[Admin] Update inventory"
      description: Sets quantity and/or reservedQuantity for a product; at least one of the two is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity:         { type: integer, minimum: 0 }
                reservedQuantity: { type: integer, minimum: 0 }
              description: At least one of quantity/reservedQuantity must be present.
      responses:
        "200":
          description: Inventory row updated (upserted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          inventory:
                            type: object
                            properties:
                              id:               { type: string, format: uuid }
                              productId:        { type: integer }
                              quantity:         { type: integer }
                              reservedQuantity: { type: integer }
                              reorderPoint:     { type: integer }
                              version:          { type: integer }
                              updatedAt:        { type: string, format: date-time }
        "400": { description: Neither quantity nor reservedQuantity provided }
        "403": { description: Admin access required }
        "404": { description: Product not found }

  # ── Admin: Payments ──────────────────────────────────────────────────────────

  /admin/payment-transactions:
    get:
      tags: [Admin]
      summary: "[Admin] List payment transactions"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: orderId
          schema: { type: string, format: uuid, nullable: true }
        - in: query
          name: userId
          schema: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Payment transactions, paginated, joined with order/user summary fields
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          transactions:
                            type: array
                            items:
                              type: object
                              properties:
                                id:                { type: string, format: uuid }
                                orderId:           { type: string, format: uuid, nullable: true }
                                razorpayOrderId:   { type: string, nullable: true }
                                razorpayPaymentId: { type: string, nullable: true }
                                eventType:         { type: string }
                                amount:            { type: integer, description: In paise }
                                currency:          { type: string, example: INR }
                                status:            { type: string }
                                metadata:          { type: object, nullable: true }
                                processedAt:       { type: string, format: date-time, nullable: true }
                                createdAt:         { type: string, format: date-time }
                                orderStatus:       { type: string, nullable: true }
                                orderTotal:        { type: integer, nullable: true, description: In paise }
                                userEmail:         { type: string, format: email, nullable: true }
                                userFirstName:     { type: string, nullable: true }
                                userLastName:      { type: string, nullable: true }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }

  /admin/orders/{id}/refund:
    post:
      tags: [Admin]
      summary: "[Admin] Initiate refund"
      description: >
        Issues a full or partial Razorpay refund for a paid order. Omit
        amount for a full refund of the order total; a full refund sets
        paymentStatus to 'refunded', a partial one to 'partially_refunded'.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: Refund amount in paise; omit for a full refund of the order total.
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        "200":
          description: Refund initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          refund:
                            type: object
                            properties:
                              refundId: { type: string }
                              amount:   { type: integer, description: In paise }
                              currency: { type: string, example: INR }
                              status:   { type: string }
                              orderId:  { type: string, format: uuid }
        "400": { description: Order not paid, has no captured payment, or refund amount exceeds order total }
        "403": { description: Admin access required }
        "404": { description: Order not found }

  # ── Admin: Coupons ───────────────────────────────────────────────────────────

  /admin/coupons:
    get:
      tags: [Admin]
      summary: "[Admin] List coupons"
      description: >
        Includes per-coupon usage stats (totalUses, uniqueUsers,
        totalDiscountGiven). Unlike the other admin list endpoints, page/limit
        here are not Joi-validated — the route has no validate() middleware —
        so out-of-range values are silently coerced by the controller instead
        of rejected with 400.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Coupons, paginated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupons:
                            type: array
                            items:
                              allOf:
                                - $ref: "#/components/schemas/AdminCoupon"
                                - type: object
                                  properties:
                                    totalUses:          { type: integer, description: Count of coupon_uses rows for this coupon }
                                    uniqueUsers:         { type: integer, description: Distinct users who have used this coupon }
                                    totalDiscountGiven:  { type: integer, description: Sum of discount_amount across uses, in paise }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }
    post:
      tags: [Admin]
      summary: "[Admin] Create coupon"
      description: >
        Shares createCouponSchema with the public-facing coupon domain, so
        both entry points enforce identical validation rules.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                code:
                  type: string
                  maxLength: 50
                  description: Uppercased and trimmed server-side.
                type:
                  type: string
                  enum: [percent, flat]
                  default: percent
                value:
                  type: number
                  minimum: 1
                  description: 0-100 for 'percent' coupons; up to 10,000,000 paise for 'flat' coupons.
                minOrderAmount:
                  type: integer
                  minimum: 0
                  maximum: 100000000
                  default: 0
                  description: In paise.
                maxUses:
                  type: integer
                  minimum: 1
                  nullable: true
                perUserLimit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 1
                validFrom:
                  type: string
                  format: date-time
                validUntil:
                  type: string
                  format: date-time
                  description: Must be after validFrom when both are supplied.
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupon: { $ref: "#/components/schemas/AdminCoupon" }
        "400": { description: Validation error }
        "403": { description: Admin access required }
        "409": { description: Coupon code already exists }

  /admin/coupons/{id}:
    patch:
      tags: [Admin]
      summary: "[Admin] Update coupon"
      description: Shares updateCouponSchema with the public-facing coupon domain. All body fields are optional but at least one is required.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                code:           { type: string, maxLength: 50 }
                type:           { type: string, enum: [percent, flat] }
                value:          { type: number, minimum: 1 }
                minOrderAmount: { type: integer, minimum: 0, maximum: 100000000, description: In paise }
                maxUses:        { type: integer, minimum: 1, nullable: true }
                perUserLimit:   { type: integer, minimum: 1, maximum: 100 }
                validFrom:      { type: string, format: date-time }
                validUntil:     { type: string, format: date-time }
      responses:
        "200":
          description: Coupon updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupon: { $ref: "#/components/schemas/AdminCoupon" }
        "403": { description: Admin access required }
        "404": { description: Coupon not found }
    delete:
      tags: [Admin]
      summary: "[Admin] Delete coupon"
      description: Soft delete — sets active to false rather than removing the row.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Coupon deactivated }
        "403": { description: Admin access required }
        "404": { description: Coupon not found }

  # ── Admin: Revenue ───────────────────────────────────────────────────────────

  /admin/revenue:
    get:
      tags: [Admin]
      summary: "[Admin] Get revenue analytics"
      description: >
        Aggregated revenue analytics: a summary, plus daily (last 30 days),
        monthly (last 13 months), and yearly (last 5 years) breakdowns. No
        query parameters. Unlike the other admin endpoints, the response data
        is the analytics object itself (no wrapper key).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Revenue analytics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            type: object
                            properties:
                              totalRevenue:  { type: number, description: In paise }
                              totalOrders:   { type: integer }
                              avgOrderValue: { type: integer, description: In paise, rounded }
                          daily:
                            type: array
                            items:
                              type: object
                              properties:
                                date:       { type: string, format: date }
                                revenue:    { type: number, description: In paise }
                                orderCount: { type: integer }
                          monthly:
                            type: array
                            items:
                              type: object
                              properties:
                                month:      { type: string, example: "2026-01" }
                                revenue:    { type: number, description: In paise }
                                orderCount: { type: integer }
                          yearly:
                            type: array
                            items:
                              type: object
                              properties:
                                year:       { type: integer, example: 2026 }
                                revenue:    { type: number, description: In paise }
                                orderCount: { type: integer }
        "403": { description: Admin access required }

  # ── Cart ──────────────────────────────────────────────────────────────────────

  /cart:
    get:
      tags: [Cart]
      summary: Get my cart
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cart with items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cart:
                            type: object
                            properties:
                              id:        { type: string, format: uuid }
                              userId:    { type: string, format: uuid }
                              createdAt: { type: string, format: date-time }
                              updatedAt: { type: string, format: date-time }
                              items:     { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        "401": { description: Unauthorized }
    delete:
      tags: [Cart]
      summary: Clear cart
      description: Deletes all items from the caller's cart. No-op (still 200) if the cart is already empty.
      security:
        - BearerAuth: []
      responses:
        "200": { description: Cart cleared }
        "401": { description: Unauthorized }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      description: >
        Not Joi-validated — the controller reads fields straight off req.body
        (jsonBody('50kb') only caps payload size). If an item with the same
        productId already exists in the cart, its quantity is incremented by
        the given quantity (default 1) rather than replaced.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, productName]
              properties:
                productId:      { type: string, example: admetec-ergo-2.5 }
                productName:    { type: string }
                productSku:     { type: string, nullable: true }
                quantity:       { type: integer, minimum: 1, default: 1 }
                unitPrice:      { type: integer, description: In paise, default: 0 }
                customization:  { type: string, nullable: true }
      responses:
        "201":
          description: Item added (or merged into an existing line)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item: { $ref: "#/components/schemas/CartItem" }
        "401": { description: Unauthorized }

  /cart/items/{id}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      description: >
        Not Joi-validated. quantity <= 0 deletes the line item and returns
        item: null with a 200 (not a 404). quantity > 0 against a
        non-existent item id returns 404.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Cart item id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, example: 2 }
      responses:
        "200":
          description: Item updated, or removed if quantity <= 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item:
                            nullable: true
                            allOf: [{ $ref: "#/components/schemas/CartItem" }]
        "401": { description: Unauthorized }
        "404": { description: Cart item not found (only when quantity > 0) }
    delete:
      tags: [Cart]
      summary: Remove cart item
      description: No-op (still 200) if the item id does not exist in the caller's cart.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Cart item id
      responses:
        "200": { description: Item removed }
        "401": { description: Unauthorized }

  /cart/sync:
    post:
      tags: [Cart]
      summary: Merge local/offline cart into server cart
      description: >
        Additive merge, not a replace: for each item, if its productId
        already exists in the cart, quantities are summed; otherwise a new
        line is inserted. Not Joi-validated (jsonBody('200kb') only caps
        payload size). items defaults to [] if omitted.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, productName]
                    properties:
                      productId:     { type: string }
                      productName:   { type: string }
                      productSku:    { type: string, nullable: true }
                      quantity:      { type: integer, minimum: 1, default: 1 }
                      unitPrice:     { type: integer, description: In paise, default: 0 }
                      customization: { type: string, nullable: true }
      responses:
        "200":
          description: Cart after merge
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cart:
                            type: object
                            properties:
                              id:        { type: string, format: uuid }
                              userId:    { type: string, format: uuid }
                              createdAt: { type: string, format: date-time }
                              updatedAt: { type: string, format: date-time }
                              items:     { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        "401": { description: Unauthorized }

  # ── Wishlist ──────────────────────────────────────────────────────────────────

  /wishlist:
    get:
      tags: [Wishlist]
      summary: Get my wishlist
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Wishlist items with a count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id:        { type: string, format: uuid }
                                userId:    { type: string, format: uuid }
                                productId: { type: string, example: admetec-ergo-2.5 }
                                createdAt: { type: string, format: date-time }
                          count: { type: integer, description: items.length }
        "401": { description: Unauthorized }
    post:
      tags: [Wishlist]
      summary: Add product to wishlist
      description: >
        Not Joi-validated (jsonBody('10kb') only caps payload size).
        Idempotent — if productId is already wishlisted for this user, the
        existing row is returned unchanged (still a 201).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, example: admetec-ergo-2.5 }
      responses:
        "201":
          description: Added to wishlist (or already present)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item:
                            type: object
                            properties:
                              id:        { type: string, format: uuid }
                              userId:    { type: string, format: uuid }
                              productId: { type: string }
                              createdAt: { type: string, format: date-time }
        "401": { description: Unauthorized }

  /wishlist/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove product from wishlist
      description: No-op (still 200) if productId is not currently wishlisted for this user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
          example: admetec-ergo-2.5
      responses:
        "200": { description: Removed from wishlist }
        "401": { description: Unauthorized }

  # ── Coupons ───────────────────────────────────────────────────────────────────

  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate a coupon before checkout
      description: Any authenticated user. Computes the discount and final total without applying/consuming the coupon.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, orderTotal]
              properties:
                code:       { type: string, minLength: 1, maxLength: 50, description: Case-insensitive, normalized to uppercase }
                orderTotal: { type: integer, minimum: 0, maximum: 100000000, description: In paise }
      responses:
        "200":
          description: Coupon is valid; discount computed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupon:
                            type: object
                            properties:
                              id:    { type: string, format: uuid }
                              code:  { type: string }
                              type:  { type: string, enum: [percent, flat] }
                              value: { type: number, description: Percent (0-100) or flat paise amount }
                          discount:   { type: integer, description: In paise }
                          finalTotal: { type: integer, description: In paise }
        "400": { description: "Coupon expired, not yet valid, below minOrderAmount, or per-user usage limit reached" }
        "404": { description: Coupon code not found }
        "422": { description: Validation error }

  /coupons:
    get:
      tags: [Coupons]
      summary: "[Admin] List active coupons"
      description: >
        Admin only. Returns only currently-active coupons (soft-deleted/
        deactivated coupons are excluded) — distinct from the separate
        admin coupon-management endpoints under /admin/coupons, which
        include inactive coupons plus usage stats. meta is nested inside
        data (this controller calls res.respond with no 4th argument), not
        a sibling top-level key.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated active coupon list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupons: { type: array, items: { $ref: "#/components/schemas/Coupon" } }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }
    post:
      tags: [Coupons]
      summary: "[Admin] Create coupon"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, value]
              properties:
                code:  { type: string, minLength: 1, maxLength: 50, description: Normalized to uppercase }
                type:  { type: string, enum: [percent, flat], default: percent }
                value:
                  type: number
                  minimum: 1
                  description: "Percent discounts: max 100. Flat discounts: max 10,000,000 paise."
                minOrderAmount: { type: integer, minimum: 0, maximum: 100000000, default: 0, description: In paise }
                maxUses:        { type: integer, minimum: 1, nullable: true }
                perUserLimit:   { type: integer, minimum: 1, maximum: 100, default: 1 }
                validFrom:      { type: string, format: date-time }
                validUntil:     { type: string, format: date-time, description: Must be after validFrom when both are given }
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupon: { $ref: "#/components/schemas/Coupon" }
        "403": { description: Admin access required }
        "409": { description: Coupon code already exists }
        "422": { description: Validation error }

  /coupons/{id}:
    put:
      tags: [Coupons]
      summary: "[Admin] Update coupon"
      description: >
        KNOWN GAP: this route is wired to validate(couponIdSchema), which
        only validates params.id — the request body is NOT run through the
        (unused) updateCouponSchema Joi schema and is passed straight to a
        partial DB update, so any subset of the coupon columns is accepted
        without type/range checking at this route.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial update — any subset of these fields (unvalidated; see description above)
              properties:
                code:           { type: string }
                type:           { type: string, enum: [percent, flat] }
                value:          { type: number }
                minOrderAmount: { type: integer, description: In paise }
                maxUses:        { type: integer, nullable: true }
                perUserLimit:   { type: integer }
                validFrom:      { type: string, format: date-time }
                validUntil:     { type: string, format: date-time, nullable: true }
                active:         { type: boolean }
      responses:
        "200":
          description: Coupon updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coupon: { $ref: "#/components/schemas/Coupon" }
        "403": { description: Admin access required }
        "404": { description: Coupon not found }
        "422": { description: Validation error (params.id only) }
    delete:
      tags: [Coupons]
      summary: "[Admin] Delete coupon"
      description: Soft delete — sets active to false; does not remove the row.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: >
            Coupon deleted. Note: the controller calls res.respond(204, null)
            which still writes a JSON envelope body despite the 204 status.
        "403": { description: Admin access required }
        "404": { description: Coupon not found }
        "422": { description: Validation error }

  # ── Shipments ────────────────────────────────────────────────────────────────

  /shipments/pincode/{pincode}/serviceability:
    get:
      tags: [Shipments]
      summary: Check pincode serviceability
      description: >
        Public — no auth. Checks whether DTDC delivers to the destination
        pincode from the configured (or overridden) origin. originPincode
        is NOT validated by Joi (only the path pincode param has a schema)
        and is passed straight through. When DTDC is not configured
        (DTDC_PX_API_KEY/DTDC_CUSTOMER_CODE missing), the response is a
        reduced shape: { serviceable: true, estimatedDays: null, note: "..." }
        with no codAvailable/availableServices/raw keys at all.
      parameters:
        - in: path
          name: pincode
          required: true
          schema: { type: string, pattern: '^[1-9]\d{5}$', example: "400001" }
        - in: query
          name: originPincode
          required: false
          schema: { type: string, example: "110001" }
          description: Unvalidated passthrough; server defaults to DTDC.ORIGIN_PINCODE (or "110001") when omitted.
      responses:
        "200":
          description: Serviceability result — shape depends on whether DTDC is configured (see description)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          serviceable:    { type: boolean }
                          estimatedDays:  { type: integer, nullable: true }
                          codAvailable:   { type: boolean, description: Only present when DTDC is configured }
                          availableServices:
                            type: array
                            description: Only present when DTDC is configured
                            items:
                              type: object
                              properties:
                                code: { type: string }
                                name: { type: string }
                                tat:  { type: string }
                          raw:  { type: object, description: Raw DTDC pincode API response; only present when DTDC is configured }
                          note: { type: string, description: Only present when DTDC is not configured }
        "400": { description: DTDC pincode API error }

  /shipments/track/{awbNo}:
    get:
      tags: [Shipments]
      summary: Track shipment by AWB
      description: >
        Any authenticated user can track by AWB — not admin-gated, and
        there is no check that the AWB belongs to the caller's own order.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: awbNo
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Shipment + live tracking data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shipment: { $ref: "#/components/schemas/Shipment" }
                          tracking:
                            type: object
                            nullable: true
                            description: >
                              Raw DTDC tracking payload passed through unmodified when DTDC
                              is configured (also persisted onto shipment.trackingEvents);
                              falls back to the last-cached trackingEvents (parsed) when DTDC
                              is not configured, or null if neither is available.
        "401": { description: Unauthorized }
        "404": { description: Shipment not found }

  /shipments/orders/{orderId}:
    get:
      tags: [Shipments]
      summary: Get shipment for my order
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shipment + cached tracking data for the order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shipment: { $ref: "#/components/schemas/Shipment" }
                          tracking:
                            type: object
                            nullable: true
                            description: shipment.trackingEvents parsed from its stored JSON string, or null.
        "404": { description: No shipment found for this order }
    post:
      tags: [Shipments]
      summary: "[Admin] Create shipment for an order"
      description: >
        Order must be 'confirmed' or 'processing'; 400 if a shipment already
        exists for the order. When DTDC is not configured, the shipment row
        is still created with awbNo: null and status: 'pending' (booking is
        skipped, not rejected). NOTE: weightGrams is Joi-validated here but
        never reaches the DTDC booking call — shipment.service.js reads
        weightKg (a key this body never contains), so weight always falls
        back to the 0.5kg default regardless of what's sent. length,
        width, height, invoiceNumber, invoiceDate are used by the
        DTDC integration internally but are rejected as unknown fields by
        this endpoint's Joi schema (allowUnknown: false) if a caller sends them.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientName, recipientPhone, recipientAddress, recipientCity, recipientState, recipientPincode]
              properties:
                recipientName:    { type: string, minLength: 1, maxLength: 150 }
                recipientPhone:   { type: string, pattern: '^[6-9]\d{9}$', description: 10-digit Indian mobile, starting 6-9 }
                recipientAddress: { type: string, minLength: 1, maxLength: 500 }
                recipientCity:    { type: string, minLength: 1, maxLength: 100 }
                recipientState:   { type: string, minLength: 1, maxLength: 100 }
                recipientPincode: { type: string, pattern: '^[1-9]\d{5}$' }
                weightGrams:      { type: integer, minimum: 1, maximum: 30000, default: 500, description: "Validated but not forwarded to DTDC — see description above" }
                declaredValue:    { type: integer, minimum: 1, maximum: 100000000, description: "In paise; defaults to the order's total when omitted" }
                productDescription: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shipment: { $ref: "#/components/schemas/Shipment" }
        "400": { description: "Order not confirmed/processing, shipment already exists, or DTDC booking failed" }
        "403": { description: Admin access required }
        "404": { description: Order not found }

  /shipments/{awbNo}/label:
    get:
      tags: [Shipments]
      summary: "[Admin] Get shipment label"
      description: Fails 400 if DTDC is not configured — label generation requires a live DTDC integration.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: awbNo
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: labelCode
          required: false
          schema: { type: string, default: SHIP_LABEL_4X6, example: SHIP_LABEL_4X6 }
          description: Unvalidated by Joi; passed straight through to DTDC (e.g. SHIP_LABEL_4X6, SHIP_LABEL_A4, SHIP_LABEL_A6, ROUTE_LABEL_A4).
        - in: query
          name: labelFormat
          required: false
          schema: { type: string, default: base64, enum: [base64, pdf] }
          description: Unvalidated by Joi. Determines whether labelBase64 or labelPdf is populated in the response.
      responses:
        "200":
          description: "Label payload — shape depends on labelFormat (base64 vs pdf)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          labelBase64:     { type: string, nullable: true, description: Present when labelFormat=base64 }
                          labelPdf:        { type: string, nullable: true, description: Present when labelFormat=pdf; raw response body as returned by DTDC }
                          referenceNumber: { type: string }
                          raw:             { type: object, description: Present only when labelFormat=base64 }
        "400": { description: DTDC not configured, or DTDC label API error }
        "403": { description: Admin access required }

  /shipments/{awbNo}/cancel:
    delete:
      tags: [Shipments]
      summary: "[Admin] Cancel shipment"
      description: >
        Fails 400 if DTDC is not configured. The local shipment row's status
        is only flipped to 'cancelled' when DTDC reports success.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: awbNo
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Cancellation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success:   { type: boolean }
                          cancelled: { type: array, items: { type: object }, description: "successConsignments array from DTDC's raw response" }
                          raw:       { type: object }
        "400": { description: DTDC not configured, or DTDC cancel API error }
        "403": { description: Admin access required }
        "404": { description: Shipment not found }

  # ── Returns ──────────────────────────────────────────────────────────────────

  /returns/orders/{id}/return:
    post:
      tags: [Returns]
      summary: Request a return
      description: >
        Calls the SAME service (return.service.js requestReturn) as
        PUT /orders/{id}/return, but wraps the result differently: this
        route answers 201 Created with data.returnRequest, while the
        /orders alias answers 200 OK with data.order — both mutate the same
        return_requests row and order-status transition in one call. Only
        allowed when the order's current status is 'delivered' (the only
        state whose valid-transition list includes 'return_requested').
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:      { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000, nullable: true }
      responses:
        "201":
          description: Return request submitted; order moved to return_requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          returnRequest: { $ref: "#/components/schemas/ReturnRequest" }
        "400": { description: "Order is not in a returnable state (must be 'delivered')" }
        "404": { description: Order not found }
        "409": { description: A pending return request already exists for this order }
    get:
      tags: [Returns]
      summary: Get return status for my order
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest return request for the order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          returnRequest: { $ref: "#/components/schemas/ReturnRequest" }
        "404": { description: Order not found, or no return request exists for this order }

  /returns/returns:
    get:
      tags: [Returns]
      summary: List my return requests
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 100 }
      responses:
        "200":
          description: >
            Paginated return requests. meta is a sibling top-level key next
            to data (res.respond's 4th argument) — NOT nested inside data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          returnRequests: { type: array, items: { $ref: "#/components/schemas/ReturnRequest" } }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }

  /returns/admin/returns:
    get:
      tags: [Returns]
      summary: "[Admin] List all return requests"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [approved, rejected, completed] }
      responses:
        "200":
          description: >
            Same pagination shape as GET /returns/returns (meta sibling to
            data). Each item additionally carries joined order/customer
            summary fields not present on the user-facing list or single-item responses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          returnRequests:
                            type: array
                            items:
                              allOf:
                                - $ref: "#/components/schemas/ReturnRequest"
                                - type: object
                                  properties:
                                    orderStatus:   { type: string, nullable: true }
                                    orderTotal:    { type: integer, nullable: true, description: In paise }
                                    userFirstName: { type: string, nullable: true }
                                    userLastName:  { type: string, nullable: true }
                                    userEmail:     { type: string, nullable: true }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403": { description: Admin access required }

  /returns/admin/returns/{returnId}:
    patch:
      tags: [Returns]
      summary: "[Admin] Process a return request"
      description: >
        Approves/rejects/completes a return and syncs the parent order's
        status: 'rejected' -> order 'delivered', 'completed' -> order
        'returned'; 'approved' leaves the order's status unchanged. This
        sync intentionally bypasses the normal order state-machine guard
        (assertValidTransition) so an admin's decision can always finalize
        the order even if it was never actually moved to 'return_requested'.
        The response body only includes the updated returnRequest — the
        (possibly updated) order is NOT returned here.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: returnId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:       { type: string, enum: [approved, rejected, completed] }
                adminNotes:   { type: string, maxLength: 1000, nullable: true }
                refundAmount: { type: integer, minimum: 0, nullable: true, description: In paise }
      responses:
        "200":
          description: Return request updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          returnRequest: { $ref: "#/components/schemas/ReturnRequest" }
        "403": { description: Admin access required }
        "404": { description: Return request not found }

  # ── Notifications ────────────────────────────────────────────────────────────

  /notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      description: >
        No validate() middleware on this route at all — page/limit/unread
        are read straight off req.query with no Joi schema, no bounds, and
        no type coercion beyond Number(). Unlike the Returns list endpoints,
        pagination meta here is nested INSIDE data (the controller calls
        res.respond(OK, result) where result already contains a meta
        key) — there is no top-level meta sibling for this endpoint.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 20 }
        - in: query
          name: unread
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Must be the literal string "true" to filter to unread only; any other value (including absent) returns all.
      responses:
        "200":
          description: Notifications with unread count; pagination meta nested inside data (see description)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          notifications:
                            type: array
                            items:
                              type: object
                              properties:
                                id:        { type: string, format: uuid }
                                userId:    { type: string, format: uuid }
                                type:      { type: string, example: order_shipped }
                                title:     { type: string }
                                body:      { type: string, nullable: true }
                                data:      { type: object, nullable: true, description: "Parsed from its stored JSON string on this endpoint only — see PUT /notifications/{id}/read" }
                                read:      { type: boolean }
                                createdAt: { type: string, format: date-time }
                                active:    { type: boolean }
                          unreadCount: { type: integer }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all my notifications as read
      security:
        - BearerAuth: []
      responses:
        "200": { description: All notifications marked as read (data is null) }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark one notification as read
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: >
            Notification marked read. Returns the raw DB row as-is — unlike
            GET /notifications, the data field here is still its
            JSON-stringified form and is NOT parsed back into an object.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          notification:
                            type: object
                            properties:
                              id:        { type: string, format: uuid }
                              userId:    { type: string, format: uuid }
                              type:      { type: string }
                              title:     { type: string }
                              body:      { type: string, nullable: true }
                              data:      { type: string, nullable: true, description: "Raw JSON string, NOT parsed (see description above)" }
                              read:      { type: boolean, example: true }
                              createdAt: { type: string, format: date-time }
                              active:    { type: boolean }
        "404": { description: Notification not found }

  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete (soft-delete) a notification
      description: >
        Sets active=false; does not check whether the notification exists
        or belongs to the caller before responding, so this returns 204
        even for a non-existent, already-deleted, or someone-else's id.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Notification deleted }

  # ── Products ──────────────────────────────────────────────────────────────────

  /products/search:
    get:
      tags: [Products]
      summary: Search products
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: category
          schema: { type: integer }
          description: Category ID filter
        - in: query
          name: brand
          schema: { type: integer }
          description: Brand ID filter
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: >
            Paginated product list. Pagination meta is nested inside
            data.meta — there is no sibling top-level meta (unlike Orders).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/Product" } }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "422": { description: Validation error }

  /products/search/advanced:
    get:
      tags: [Products]
      summary: Advanced product search
      description: >
        Like /products/search but forwards any extra, unvalidated query keys
        straight through to the repository as filters (categoryId, brandId,
        currency, minPrice, maxPrice, hasVariants, etc.) — the Joi schema for
        this route uses .unknown(true) deliberately. Note: if sort is
        provided it must be one of the 5 enum values below (a literal
        sort=relevance is rejected by validation); "relevance" only appears
        when sort is omitted entirely, via the controller's own default —
        and the repository has no "relevance" ordering case, so it silently
        falls back to sortOrder ASC.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: sort
          schema: { type: string, enum: [order, price_asc, price_desc, name_asc, name_desc] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated product list; meta additionally echoes the resolved sort.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/Product" } }
                          meta:
                            allOf:
                              - $ref: "#/components/schemas/PaginationMeta"
                              - type: object
                                properties:
                                  sort: { type: string, example: relevance }
        "422": { description: Validation error }

  /products/categories:
    get:
      tags: [Products]
      summary: List categories
      responses:
        "200":
          description: Category list (unpaginated).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          categories:
                            type: array
                            items:
                              type: object
                              properties:
                                id:          { type: integer }
                                slug:        { type: string }
                                name:        { type: string }
                                type:        { type: string, example: category }
                                description: { type: string, nullable: true }
                                image:       { type: string, nullable: true }
                                parentId:    { type: integer, nullable: true }
                                brandId:     { type: integer, nullable: true }
                                sortOrder:   { type: integer }
                                specialPage: { type: string, nullable: true }
                                active:      { type: boolean }
                                createdAt:   { type: string, format: date-time }
                                modifiedAt:  { type: string, format: date-time }

  /products/brands:
    get:
      tags: [Products]
      summary: List brands
      description: >
        Each brand additionally carries a computed productCount (active
        products in that brand); active/createdAt/modifiedAt are not
        selected by this query and are omitted from the response.
      responses:
        "200":
          description: Brand list (unpaginated).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          brands:
                            type: array
                            items:
                              type: object
                              properties:
                                id:           { type: integer }
                                slug:         { type: string }
                                name:         { type: string }
                                description:  { type: string, nullable: true }
                                image:        { type: string, nullable: true }
                                sortOrder:    { type: integer }
                                productCount: { type: integer, description: Count of active products in this brand }

  /products/compare:
    get:
      tags: [Products]
      summary: Compare products
      description: >
        Compares 2–4 products side by side. The 2–4 count rule is enforced
        by the service, not the Joi schema (which only bounds the raw
        comma-separated string's length).
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string, example: "101,102,103" }
          description: Comma-separated product IDs (2–4 required)
      responses:
        "200":
          description: >
            Compare matrix — a reduced product projection (not the full
            Product schema), plus the union of spec labels across all
            compared products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items:
                              type: object
                              properties:
                                id:           { type: integer }
                                slug:         { type: string }
                                name:         { type: string }
                                brandId:      { type: integer, nullable: true }
                                basePrice:    { type: integer, nullable: true, description: In paise }
                                currency:     { type: string, example: INR }
                                defaultImage: { type: string, nullable: true }
                                specs:
                                  type: object
                                  description: Map of spec label to value, from the product's "specifications" content block
                                  additionalProperties: { type: string }
                          specKeys:
                            type: array
                            items: { type: string }
                            description: Union of all spec labels across the compared products
        "400": { description: "Missing ids, or fewer than 2 / more than 4 IDs provided" }
        "404": { description: One or more product IDs not found }
        "422": { description: Validation error }

  /products:
    get:
      tags: [Products]
      summary: List products
      description: Public catalog listing with filters and pagination. No authentication required.
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: category
          schema: { type: integer }
          description: Category ID filter
        - in: query
          name: brand
          schema: { type: integer }
          description: Brand ID filter
        - in: query
          name: hasVariants
          schema: { type: boolean }
        - in: query
          name: minPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: currency
          schema: { type: string, minLength: 3, maxLength: 3 }
          description: ISO currency code, uppercased (e.g. INR)
        - in: query
          name: sort
          schema: { type: string, enum: [order, price_asc, price_desc, name_asc, name_desc] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: >
            Paginated product list. Pagination meta is nested inside
            data.meta — there is no sibling top-level meta (unlike Orders).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/Product" } }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "422": { description: Validation error }

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product
      description: Accepts either a numeric product ID or a product slug.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, example: admetec-ergo-2.5 }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          product: { $ref: "#/components/schemas/Product" }
        "404": { description: Product not found }
        "422": { description: Validation error }

  /products/{id}/variants:
    get:
      tags: [Products]
      summary: Get product variants
      description: >
        Returns an empty variants array when the product's hasVariants is
        false — this is not a 404 case.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, example: admetec-ergo-2.5 }
      responses:
        "200":
          description: Product with its variant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          product: { $ref: "#/components/schemas/Product" }
                          variants:
                            type: array
                            items:
                              type: object
                              properties:
                                id:              { type: string }
                                name:            { type: string }
                                colorCode:       { type: string, nullable: true }
                                images:          { type: array, items: { type: string } }
                                additionalPrice: { type: integer, default: 0, description: In paise }
        "404": { description: Product not found }
        "422": { description: Validation error }

  # ── Reviews ───────────────────────────────────────────────────────────────────

  /reviews/products/{productId}:
    get:
      tags: [Reviews]
      summary: List approved reviews for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, maxLength: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: >
            Approved reviews plus aggregate stats. Pagination meta is nested
            inside data.meta — there is no sibling top-level meta.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reviews:
                            type: array
                            items: { $ref: "#/components/schemas/Review" }
                          stats:
                            type: object
                            properties:
                              count: { type: integer, example: 12 }
                              avg:   { type: number, nullable: true, example: 4.3, description: Rounded to 1 decimal; null when count is 0 }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "422": { description: Validation error }

  /reviews:
    post:
      tags: [Reviews]
      summary: Create a review
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, rating]
              properties:
                productId: { type: string, minLength: 1, maxLength: 100 }
                orderId:   { type: string, format: uuid, nullable: true }
                rating:    { type: integer, minimum: 1, maximum: 5 }
                title:     { type: string, maxLength: 200, nullable: true }
                body:      { type: string, maxLength: 2000, nullable: true }
      responses:
        "201":
          description: Review submitted — pending approval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          review: { $ref: "#/components/schemas/Review" }
        "401": { description: Authentication required }
        "409": { description: You have already reviewed this product }
        "422": { description: Validation error }

  /reviews/{id}:
    delete:
      tags: [Reviews]
      summary: Delete a review
      description: Owner can delete their own review; an admin can delete any review.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Review deleted }
        "401": { description: Authentication required }
        "403": { description: "Not your review (non-admin caller)" }
        "404": { description: Review not found }
        "422": { description: Validation error }

  /reviews/pending:
    get:
      tags: [Reviews]
      summary: "[Admin] List pending (unapproved) reviews"
      security:
        - BearerAuth: []
      description: >
        Requires the admin role. Unlike the other list endpoints in this
        domain, this route has no validate() middleware — page/limit
        are read straight off req.query with defaults but no Joi bounds.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Pending reviews, paginated (meta nested inside data, not sibling).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reviews:
                            type: array
                            items: { $ref: "#/components/schemas/Review" }
                          meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }

  /reviews/{id}/approve:
    put:
      tags: [Reviews]
      summary: "[Admin] Approve or reject a review"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          review: { $ref: "#/components/schemas/Review" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "404": { description: Review not found }
        "422": { description: Validation error }

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  # All 5 endpoints require BearerAuth with the admin role (dashboardRouter.use(overallLimiter, auth('admin')) applies to every route below).

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: "[Admin] Dashboard summary"
      description: Combines this-month order stats, this-month user stats, and the top 5 products in one call (dashboardService.getSummary).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders: { $ref: "#/components/schemas/OrderStats" }
                          users:  { $ref: "#/components/schemas/UserStats" }
                          topProducts:
                            type: array
                            items: { $ref: "#/components/schemas/TopProduct" }
        "403": { description: Admin access required }

  /dashboard/orders/stats:
    get:
      tags: [Dashboard]
      summary: "[Admin] Order stats"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, week, month, year], default: month }
      responses:
        "200":
          description: Order stats for the given period
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/OrderStats" }
        "403": { description: Admin access required }

  /dashboard/users/stats:
    get:
      tags: [Dashboard]
      summary: "[Admin] User stats"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, week, month, year], default: month }
      responses:
        "200":
          description: User stats for the given period
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserStats" }
        "403": { description: Admin access required }

  /dashboard/products/top:
    get:
      tags: [Dashboard]
      summary: "[Admin] Top-selling products"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: period
          schema: { type: string, enum: [today, week, month, year], default: month }
      responses:
        "200":
          description: Top products by revenue for the given period
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items: { $ref: "#/components/schemas/TopProduct" }
        "403": { description: Admin access required }

  /dashboard/revenue/daily:
    get:
      tags: [Dashboard]
      summary: "[Admin] Daily revenue series"
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: days
          description: Size of the trailing window, in days.
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Revenue and order count grouped by day, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                date:       { type: string, format: date }
                                revenue:    { type: integer, description: In paise }
                                orderCount: { type: integer }
        "403": { description: Admin access required }

  # ── Inventory ─────────────────────────────────────────────────────────────────
  # Read-through Redis cache (5 min TTL) of Zoho Inventory. GET endpoints are
  # public (no auth) per inventory.routes.js; only POST /sync requires admin.
  #
  # NOTE — deliberately inconsistent with every other list endpoint in this API:
  # the list endpoint below paginates with a perPage query param (not limit)
  # and nests a pagination object (not meta) inside data, with fields
  # { page, perPage, total, totalPages, hasNext, hasPrev }. This is documented
  # as-is; it is not a typo and should not be "fixed" to match other domains.

  /inventory/items:
    get:
      tags: [Inventory]
      summary: List inventory items
      description: >
        Public — no auth. Reads from the Zoho-backed Redis cache (5 min TTL)
        unless ?refresh=true forces a cache-bust fetch from Zoho first.
        Filtering (search/category/inStock) and pagination are applied
        in-memory after the cache read.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: perPage
          description: Page size. Distinct from the limit param used elsewhere in this API.
          schema: { type: integer, default: 24, maximum: 100 }
        - in: query
          name: search
          description: Case-insensitive match against name, sku, or description.
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: inStock
          description: Pass "true" to only return items with availableForSale > 0.
          schema: { type: string, enum: ["true"] }
        - in: query
          name: refresh
          description: Pass "true" to bypass the Redis cache and re-fetch from Zoho.
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: Inventory items fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/ZohoInventoryItem" }
                          pagination:
                            type: object
                            description: >
                              This endpoint's own pagination shape — nested inside
                              data.pagination, not the top-level meta object
                              other list endpoints use.
                            properties:
                              page:       { type: integer, example: 1 }
                              perPage:    { type: integer, example: 24 }
                              total:      { type: integer, example: 137 }
                              totalPages: { type: integer, example: 6 }
                              hasNext:    { type: boolean }
                              hasPrev:    { type: boolean }
                          categories:
                            type: array
                            items: { type: string }
                            description: Distinct categories across the full unfiltered item list, for building a filter dropdown.
                          cachedAt: { type: string, format: date-time }

  /inventory/items/{itemId}:
    get:
      tags: [Inventory]
      summary: Get a single inventory item
      description: Public — no auth. Fetches directly from Zoho (not the list cache).
      parameters:
        - in: path
          name: itemId
          required: true
          description: Zoho item_id.
          schema: { type: string }
      responses:
        "200":
          description: Inventory item fetched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          item: { $ref: "#/components/schemas/ZohoInventoryItem" }
        "400": { description: Item not found in Zoho Inventory }

  /inventory/sync:
    post:
      tags: [Inventory]
      summary: "[Admin] Force a cache-bust sync from Zoho"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Inventory synced from Zoho
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          synced:   { type: integer, description: Number of items fetched from Zoho }
                          syncedAt: { type: string, format: date-time }
        "403": { description: Admin access required }

  /inventory/webhook:
    post:
      tags: [Inventory]
      summary: Zoho inventory-change webhook
      description: >
        Called by Zoho when stock changes — no auth (Zoho handles delivery
        from their side). Invalidates the Redis items cache so the next
        GET /inventory/items re-fetches from Zoho.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Zoho webhook payload — not schema-validated.
      responses:
        "200": { description: Webhook received }

  # ── Health ───────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Deep health check
      responses:
        "200": { description: Healthy }
        "503": { description: Degraded }

  /health/live:
    servers:
      - url: http://localhost:{port}
        variables:
          port:
            default: "5000"
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200": { description: Process alive }

  /health/ready:
    servers:
      - url: http://localhost:{port}
        variables:
          port:
            default: "5000"
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /api/versions:
    servers:
      - url: http://localhost:{port}
        variables:
          port:
            default: "5000"
    get:
      tags: [Health]
      summary: Supported API versions
      responses:
        "200": { description: Version info }
